<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Romantic Story</title>

  <link rel="stylesheet" href="Romantic_Storytelling_style.css">
  <link rel="stylesheet" href="Romantic_Storytelling_animation.css">
  <link rel="stylesheet" href="Romantic_Storytelling_background.css">
</head>
<body>

<div class="container">

  <!-- TEXT SECTION -->
  <div class="text-box">
    <p id="animatedText"></p>
  </div>

  <!-- CARTOON SCENE -->
  <div class="scene">

    <!-- Boy -->
    <div class="boy">
      <div class="head"></div>
      <div class="body"></div>
    </div>

    <!-- Girl -->
    <div class="girl">
      <div class="head"></div>
      <div class="body"></div>
    </div>

    <!-- Heart -->
    <div class="heart"></div>

  </div>

  <button id="startBtn">Start Romantic Story ❤️</button>

</div>

<script src="Romantic_Storytelling_textanimation.js"></script>
<script src="Romantic_Storytelling_scene.js"></script>
<script src="Romantic_Storytelling_effects.js"></script>


</body>
</html>
