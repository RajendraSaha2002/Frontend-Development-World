<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distributed Engine Orchestrator</title>
    <link rel="stylesheet" href="css/Orchestrator_engine_layout.css">
    <link rel="stylesheet" href="css/Orchestrator_engine_badges.css">
    <link rel="stylesheet" href="css/Orchestrator_engine_dag.css">
    <link rel="stylesheet" href="css/Orchestrator_engine_logs.css">
</head>
<body>
<div id="app-shell">
    <header id="main-header">
        <div class="logo">ORCHESTRATOR // DISPATCH CONTROL</div>
        <button id="btn-trigger" class="primary-btn">TRIGGER PIPELINE</button>
    </header>

    <main id="workspace">
        <section id="dag-panel">
            <div class="panel-header">
                <h2>WORKFLOW DEPENDENCY GRAPH (DAG)</h2>
                <span id="pipeline-status" class="badge" style="--status-color: var(--color-pending);">IDLE</span>
            </div>
            <div id="svg-viewport">
                <svg id="dag-svg" width="100%" height="100%"></svg>
            </div>
        </section>

        <section id="log-panel">
            <div class="panel-header">
                <h2>LIVE SUBPROCESS STREAM (<span id="active-job-name">NONE SELECTED</span>)</h2>
                <span class="badge" style="--status-color: var(--color-running);">STREAM: ACTIVE</span>
            </div>
            <div id="terminal-view" aria-live="polite" role="log"></div>
        </section>
    </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
